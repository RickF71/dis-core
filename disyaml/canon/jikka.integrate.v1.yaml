type: jikka.integrate.v1
version: v1.0
description: >
  Integrates a completed Jikka token back into its human owner’s personal domain.
  All actions recorded during the token’s active period are merged into the
  owner’s ledger and acknowledged with receipts for each participant domain.

fields:
  - name: token_id
    type: string
    required: true
    description: The unique ID of the Jikka token being integrated.

  - name: owner
    type: dis_uid
    required: true
    description: The human DIS-UID who activated this token.

  - name: domain_target
    type: domain_ref
    required: true
    description: The personal domain into which the token’s log will be merged.

  - name: actions
    type: list(object)
    required: true
    description: >
      The list of action records (type, timestamp, context, receipt_ref)
      accumulated during the token session.

  - name: receipts
    type: list(receipt_ref)
    required: true
    description: All receipts generated by this integration event.

  - name: integrated_at
    type: timestamp
    required: true
    description: Timestamp of successful merge.

  - name: hash
    type: string
    required: true
    description: Canonical hash of token state at time of integration.

policy:
  trigger: jikka.integrate.v1
  on_apply:
    - validate: "token.owner == owner"
    - validate: "token.active == false"
    - action: "merge token.actions into domain.personal[owner].ledger"
    - emit: "jikka.receipt.integration.v1"

minset5:
  identity_binding: true
  non_bypass: true
  signed_receipt: true
  ci_provenance: jikka.proof.enforcement.v1
  policy_ref: jikka.integrate.v1

metadata:
  renewable: false
  transferable: false
  indexed: ["owner", "token_id", "integrated_at"]
status: draft
created_at: 2025-11-04T00:00:00Z
