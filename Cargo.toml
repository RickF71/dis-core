[package]
name = "dis_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "dis_core"
path = "src/lib.rs"

[dependencies]

rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }



