<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DIS Spine</title>
  <style>
    :root {
      --bg: #0e0f13;
      --panel: #161821;
      --text: #e6e8ef;
      --muted: #9aa0b4;
      --accent: #7aa2f7;
      --border: #2a2d3a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem 2.5rem;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0.5rem 0;
      color: var(--muted);
    }

    code {
      font-family: var(--mono);
      background: #0b0c10;
      border: 1px solid var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      color: var(--accent);
    }

    .status {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.9rem;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ece6a;
      margin-right: 6px;
      box-shadow: 0 0 6px rgba(158,206,106,0.8);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>DIS Spine</h1>
    <p>Root runtime active.</p>
    <p>API surface: <code>/api</code></p>

    <div class="status">
      <p><span class="dot"></span>status: running</p>
      <p>role: spine</p>
    </div>
  </div>
</body>
</html>
