# ============================================================
# DIS-CORE: seat.unified.v1
# ------------------------------------------------------------
# Unified canonical model combining the conceptual, registry,
# and operational aspects of a Seat within DIS.
# ============================================================

version: 1
kind: schema
name: dis-core.seat.unified.v1
dis_core_binding: v1.0
$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [meta, registry, instance]
additionalProperties: false

properties:
  meta:
    type: object
    description: "Canonical structural and ethical definition of what a Seat is."
    required: [schema_id, schema_version, principles, rules]
    properties:
      schema_id: { type: string, const: "domain.seat" }
      schema_version: { type: string, const: "v1.0" }
      principles:
        type: array
        items: { type: string }
        description: "Philosophical and ethical axioms for Seats."
      rules:
        type: array
        items: { type: string }
        description: "Operational constraints inherited by all Seats."
      authoritant_extension:
        type: object
        properties:
          enabled: { type: boolean }
          renewal_required: { type: boolean }
          notes: { type: array, items: { type: string } }

  registry:
    type: object
    description: "Domain-level registry of seats."
    required: [domain_ref, seats]
    properties:
      domain_ref: { type: string }
      seats:
        type: array
        items:
          type: object
          required: [seat_id, lineage_ref, verified]
          properties:
            seat_id: { type: string }
            lineage_ref: { type: string }
            verified: { type: boolean }
            last_handshake: { type: ["string", "null"], format: "date-time" }
            peer_links: { type: array, items: { type: string } }

  instance:
    type: object
    description: "Operational record of one active seat."
    required: [seat_id, domain_ref, seat_holder, lineage, policy, receipts]
    properties:
      seat_id: { type: string }
      domain_ref: { type: string }
      seat_label: { type: string }
      seat_holder:
        type: object
        required: [entity_id, entity_type, status, tech_participation]
        properties:
          entity_id: { type: string }
          entity_type:
            { type: string, enum: [individual, corporation, ai, community] }
          status: { type: string, enum: [dis, nodis] }
          tech_participation: { type: string, enum: [full, limited, notech] }
      lineage:
        type: object
        required: [anchor_receipt, parent_authority_ref]
        properties:
          anchor_receipt: { type: string }
          parent_authority_ref: { type: string }
          succession:
            type: array
            items:
              type: object
              required: [from, to, receipt]
              properties:
                from: { type: string }
                to: { type: string }
                receipt: { type: string }
      policy:
        type: object
        required: [issue_receipts, verify_lineage, reject_unanchored, issue_to]
        properties:
          issue_receipts: { type: boolean }
          verify_lineage: { type: boolean }
          reject_unanchored: { type: boolean }
          issue_to:
            { type: string, enum: [dis_only, allow_nodis_via_containment] }
          containment_profile_ref: { type: ["string", "null"] }
      receipts:
        type: object
        required: [chain_id, items]
        properties:
          chain_id: { type: string }
          head: { type: ["string", "null"] }
          items:
            type: array
            items:
              type: object
              required: [rid, ts, action, actor, payload_hash]
              properties:
                rid: { type: string }
                ts: { type: string, format: date-time }
                action: { type: string }
                actor:
                  type: object
                  required: [entity_id, status]
                  properties:
                    entity_id: { type: string }
                    status: { type: string, enum: [dis, nodis] }
                payload_hash: { type: string }
                prev: { type: ["string", "null"] }

example:
  meta:
    schema_id: "domain.seat"
    schema_version: "v1.0"
    principles:
      - "Every seat acts as structure, not personality."
      - "Seat authority flows from domain consent."
    rules:
      - "A seat must trace to an authoritant lineage."
    authoritant_extension:
      enabled: true
      renewal_required: true
  registry:
    domain_ref: "terra"
    seats:
      - seat_id: "seat_terra_core"
        lineage_ref: "authority.root:terra"
        verified: true
        last_handshake: "2025-10-09T04:00:00Z"
  instance:
    seat_id: "seat_terra_core"
    domain_ref: "terra"
    seat_holder:
      entity_id: "did:dis:terra:authority.core"
      entity_type: "community"
      status: "dis"
      tech_participation: "full"
    lineage:
      anchor_receipt: "0xabc123..."
      parent_authority_ref: "authority.root:terra"
      succession: []
    policy:
      issue_receipts: true
      verify_lineage: true
      reject_unanchored: true
      issue_to: "dis_only"
      containment_profile_ref: null
    receipts:
      chain_id: "seat:terra_core"
      head: null
      items: []
